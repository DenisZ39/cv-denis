name: Build and Release CV

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: cv.tex
          compiler: pdflatex

      - name: Upload PDF as artifact
        uses: actions/upload-artifact@v4
        with:
          name: CV-Denis-Zamosteanu
          path: cv.pdf

      - name: Create Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          files: cv.pdf
          tag_name: "latest"
          name: "Latest CV"
          body: "Automated build of the latest CV from LaTeX source."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Pages Folder
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir public
          cp cv.pdf public/
          echo '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0; url=cv.pdf" /></head><body><p><a href="cv.pdf">Redirecting to CV...</a></p></body></html>' > public/index.html

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
